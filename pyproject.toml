[project]
name = "muhaqqiq"
version = "0.1.0"
description = "Muhaqqiq - a multi-agent research and report agent that turns a question into a cited, verified report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AAASE Capstone - SDAIA Academy" }]
keywords = ["agents", "langgraph", "research", "mcp", "fastapi", "sdaia"]

dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
    "fastmcp>=2.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
trace = [
    "langsmith>=0.2",
]

[project.scripts]
muhaqqiq = "muhaqqiq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muhaqqiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]
